
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Riley Berends</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafaf8;
      color: #202020;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    main {
      text-align: center;
      padding: 24px;
      animation: verschijnen 1s ease both;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.055em;
      margin: 0;
      line-height: 1.3;
    }

    /* De i zonder normaal puntje */
    .letter-i {
      position: relative;
      display: inline-block;
      width: 0.27em;
      height: 0.75em;
      vertical-align: baseline;
    }

    .letter-i::before {
      content: "";
      position: absolute;
      bottom: 0.035em;
      left: 50%;
      transform: translateX(-50%);
      width: 0.125em;
      height: 0.53em;
      background: currentColor;
      border-radius: 0.015em;
    }

    /* Smiley als puntje van de i */
    .smiley {
      position: absolute;
      width: 0.23em;
      height: 0.23em;
      left: 50%;
      top: -0.035em;
      transform: translateX(-50%);
      background: #5576dc;
      border-radius: 50%;
      animation: zweven 2.5s ease-in-out infinite;
    }

    .smiley::before,
    .smiley::after {
      content: "";
      position: absolute;
      background: white;
      width: 12%;
      height: 12%;
      border-radius: 50%;
      top: 30%;
    }

    .smiley::before {
      left: 30%;
    }

    .smiley::after {
      right: 30%;
    }

    .mond {
      position: absolute;
      left: 30%;
      top: 43%;
      width: 40%;
      height: 27%;
      border-bottom: 1.5px solid white;
      border-radius: 0 0 50% 50%;
    }

    .bio {
      color: #777;
      font-size: 1.1rem;
      margin: 12px 0 32px;
    }

    .linkedin {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 24px;
      border: 1px solid #dededb;
      border-radius: 100px;
      background: white;
      color: #202020;
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .linkedin:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .linkedin svg {
      width: 20px;
      height: 20px;
      fill: #0a66c2;
    }

    @keyframes verschijnen {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes zweven {
      0%, 100% {
        transform: translate(-50%, 0);
      }
      50% {
        transform: translate(-50%, -0.045em);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main>
    <h1>
      R<span class="letter-i" role="img"
        aria-label="i met smiley">
        <span class="smiley">
          <span class="mond"></span>
        </span>
      </span>ley Berends
    </h1>

    <p class="bio">Mechatronica</p>

    <a class="linkedin"
       href="https://nl.linkedin.com/in/riley-berends-070a61213"
       target="_blank"
       rel="noopener noreferrer">

      <svg viewBox="0 0 24 24"
           aria-hidden="true">
        <path d="M20.447 20.452h-3.554v-5.569
        c0-1.328-.027-3.037-1.852-3.037
        -1.853 0-2.136 1.445-2.136 2.939
        v5.667H9.35V9h3.414v1.561h.049
        c.476-.9 1.637-1.85 3.37-1.85
        3.601 0 4.267 2.37 4.267 5.455
        v6.286zM5.337 7.433a2.062 2.062
        0 1 1 0-4.124 2.062 2.062 0 0 1
        0 4.124zM7.119 20.452H3.555V9
        h3.564v11.452z"/>
      </svg>

      LinkedIn ↗
    </a>
  </main>

</body>
</html>
