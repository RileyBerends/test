
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafaf8">
  <meta name="description" content="Riley Berends — Mechatronica">
  <title>Riley Berends</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #fafaf8;
      --text: #222222;
      --muted: #858585;
      --border: #e5e5e1;
      --blue: #5576dc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--text);
      font-family: "Inter", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    .intro {
      width: 100%;
      animation: verschijnen 0.9s ease both;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4.4rem);
      font-weight: 600;
      letter-spacing: -0.055em;
      line-height: 1.3;
      white-space: nowrap;
    }

    /*
      De letter i blijft een echte letter.
      Het blauwe smileytje bedekt het puntje.
    */
    .letter-i {
      position: relative;
      display: inline-block;
    }

    .letter-i::before {
      content: "";
      position: absolute;
      z-index: 1;
      top: 0.12em;
      left: 50%;
      width: 0.28em;
      height: 0.20em;
      transform: translateX(-50%);
      background: var(--background);
    }

    .smiley {
      position: absolute;
      z-index: 2;
      top: 0.13em;
      left: 50%;
      width: 0.22em;
      height: 0.22em;
      border-radius: 50%;
      background: var(--blue);
      animation: zweven 2.5s ease-in-out infinite;
    }

    .smiley::before,
    .smiley::after {
      content: "";
      position: absolute;
      top: 30%;
      width: 12%;
      height: 12%;
      border-radius: 50%;
      background: white;
    }

    .smiley::before {
      left: 30%;
    }

    .smiley::after {
      right: 30%;
    }

    .mond {
      position: absolute;
      top: 43%;
      left: 30%;
      width: 40%;
      height: 27%;
      border-bottom: 1.5px solid white;
      border-radius: 0 0 50% 50%;
    }

    .bio {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 400;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 36px;
    }

    .linkedin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 12px 23px;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: white;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }

    .linkedin:hover {
      transform: translateY(-3px);
      border-color: #d5d5d0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07);
    }

    .linkedin:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 4px;
    }

    .linkedin svg {
      width: 19px;
      height: 19px;
      fill: #0a66c2;
    }

    .arrow {
      color: #888;
    }

    footer {
      width: 100%;
      padding: 18px 20px 26px;
      text-align: center;
      color: #999;
      font-size: 12px;
      line-height: 1.6;
    }

    @keyframes verschijnen {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes zweven {
      0%, 100% {
        transform: translate(-50%, 0);
      }

      50% {
        transform: translate(-50%, -0.045em);
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: clamp(1.9rem, 8.7vw, 3rem);
      }

      .bio {
        font-size: 1rem;
      }

      .actions {
        margin-top: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

      .smiley {
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="intro">

      <h1 aria-label="Riley Berends">
        R<span class="letter-i" aria-hidden="true">i<span class="smiley"><span class="mond"></span></span></span>ley Berends
      </h1>

      <p class="bio">Mechatronica</p>

      <div class="actions">
        <a
          class="linkedin"
          href="https://nl.linkedin.com/in/riley-berends-070a61213"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Bekijk mijn LinkedIn-profiel"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.447 20.452h-3.554v-5.569
            c0-1.328-.027-3.037-1.852-3.037
            -1.853 0-2.136 1.445-2.136 2.939
            v5.667H9.35V9h3.414v1.561h.049
            c.476-.9 1.637-1.85 3.37-1.85
            3.601 0 4.267 2.37 4.267 5.455
            v6.286zM5.337 7.433a2.062 2.062
            0 1 1 0-4.124 2.062 2.062 0 0 1
            0 4.124zM7.119 20.452H3.555V9
            h3.564v11.452z"/>
          </svg>

          <span>LinkedIn</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </div>

    </div>
  </main>

  <footer>
    © 2026 Riley Berends · Gemaakt met heel veel schik.
  </footer>
</body>
</html>
